<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>Long-lived ports</title>
  <style>
    body {
      width: 300px;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    #counter {
      font-size: 2.4em;
      font-weight: bold;
      color: #1a73e8;
    }

    #log {
      margin-top: 10px;
      padding: 8px;
      height: 90px;
      overflow-y: auto;
      background-color: #f0f0f0;
      border: 1px solid #ccc;
      border-radius: 4px;
      text-align: left;
      font-family: monospace;
      font-size: 12px;
    }

    button {
      padding: 8px 12px;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <h1>Long-lived ports</h1>
  <p>The service worker pushes a message every second over an open port, without
    the popup asking for it.</p>
  <div id="counter">0</div>
  <button id="reset">Reset counter</button>
  <div id="log"></div>
  <script src="popup.js"></script>
</body>

</html>
