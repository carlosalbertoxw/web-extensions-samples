<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>Offscreen document</title>
  <style>
    body {
      width: 300px;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    button {
      padding: 8px 12px;
      cursor: pointer;
    }

    #result {
      margin-top: 12px;
      padding: 10px;
      min-height: 40px;
      background-color: #f0f0f0;
      border: 1px solid #ccc;
      border-radius: 4px;
      text-align: left;
      font-family: monospace;
      font-size: 12px;
    }
  </style>
</head>

<body>
  <h1>Offscreen document</h1>
  <p>The service worker has no DOM, so it opens a hidden page to run
    <code>DOMParser</code> and closes it again.</p>
  <button id="parse">Parse a sample document</button>
  <div id="result">Click the button.</div>
  <script src="popup.js"></script>
</body>

</html>
