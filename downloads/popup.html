<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>Downloads</title>
  <style>
    body {
      width: 320px;
      font-family: Arial, sans-serif;
    }

    h1 {
      text-align: center;
      font-size: 1.2em;
    }

    button {
      width: 100%;
      padding: 8px;
      cursor: pointer;
    }

    #status {
      font-size: 13px;
      min-height: 18px;
      color: #1a73e8;
      text-align: center;
    }

    ul {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    li {
      padding: 6px 4px;
      border-bottom: 1px solid #eee;
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
  </style>
</head>

<body>
  <h1>Downloads</h1>
  <button id="download">Download a generated text file</button>
  <p id="status"></p>
  <h2 style="font-size:1em">Recent downloads</h2>
  <ul id="list"></ul>
  <script src="popup.js"></script>
</body>

</html>
