<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>Keyboard shortcuts</title>
  <style>
    body {
      width: 300px;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    kbd {
      background-color: #eee;
      border: 1px solid #ccc;
      border-radius: 3px;
      padding: 2px 6px;
      font-family: monospace;
    }
  </style>
</head>

<body>
  <h1>Keyboard shortcuts</h1>
  <p>Shortcut: <kbd id="shortcut">...</kbd></p>
  <p id="hint"></p>
  <p>You can change the shortcut at <code>chrome://extensions/shortcuts</code>.</p>
  <script src="popup.js"></script>
</body>

</html>
