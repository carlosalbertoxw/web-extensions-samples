<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>Context menu</title>
  <style>
    body {
      width: 300px;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    li {
      text-align: left;
      margin-bottom: 6px;
      font-size: 13px;
    }
  </style>
</head>

<body>
  <h1>Context menu</h1>
  <p>This extension adds two entries to the right-click menu:</p>
  <ul>
    <li>Select some text, right-click it and choose <strong>Count letters</strong>.</li>
    <li>Right-click anywhere on a page and choose <strong>Say hello</strong>.</li>
  </ul>
  <p>Both show a system notification with the result.</p>
</body>

</html>
